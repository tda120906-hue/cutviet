name: API probe
on:
  push:
    branches: [api-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Versions
        run: |
          for a in media3-transformer; do curl -s https://dl.google.com/android/maven2/androidx/media3/$a/maven-metadata.xml | grep -o '<version>[^<]*</version>' | tr '\n' ' '; echo; done
          curl -s https://dl.google.com/android/maven2/androidx/compose/compose-bom/maven-metadata.xml | grep -o '<version>[^<]*</version>' | tail -5 | tr '\n' ' '; echo
          curl -s https://dl.google.com/android/maven2/com/android/tools/build/gradle/maven-metadata.xml | grep -o '<version>[^<]*</version>' | tail -8 | tr '\n' ' '; echo
      - name: Javap2
        run: |
          set +e
          curl -s https://dl.google.com/android/maven2/com/android/tools/build/gradle/maven-metadata.xml | grep -o '<version>[^<]*</version>' | grep -v -E 'alpha|beta|rc|dev' | tail -12 | tr '\n' ' '; echo
          curl -s https://dl.google.com/android/maven2/androidx/core/core-ktx/maven-metadata.xml | grep -o '<version>[^<]*</version>' | grep -v -E 'alpha|beta|rc' | tail -3 | tr '\n' ' '; echo
          curl -s https://dl.google.com/android/maven2/androidx/activity/activity-compose/maven-metadata.xml | grep -o '<version>[^<]*</version>' | grep -v -E 'alpha|beta|rc' | tail -3 | tr '\n' ' '; echo
          curl -s https://repo1.maven.org/maven2/org/jetbrains/kotlin/kotlin-gradle-plugin/maven-metadata.xml | grep -o '<version>[^<]*</version>' | grep -v -E 'Beta|RC|dev|M' | tail -6 | tr '\n' ' '; echo
          V=1.11.1; mkdir j; cd j
          for a in media3-transformer media3-effect media3-common media3-exoplayer media3-ui; do
            curl -sfLo $a.aar https://dl.google.com/android/maven2/androidx/media3/$a/$V/$a-$V.aar && unzip -qo $a.aar classes.jar && mv classes.jar $a.jar; unzip -p $a.aar META-INF/com/android/build/gradle/aar-metadata.properties; echo
          done
          curl -s https://dl.google.com/android/maven2/androidx/media3/media3-transformer/$V/media3-transformer-$V.pom | grep -A2 artifactId | head -60
          CP=$(ls *.jar | tr '\n' ':')
          for c in androidx.media3.effect.TextOverlay androidx.media3.effect.OverlayEffect androidx.media3.effect.Presentation androidx.media3.transformer.Transformer androidx.media3.transformer.Transformer\$Builder androidx.media3.transformer.Transformer\$Listener androidx.media3.common.MediaItem\$Builder androidx.media3.common.SpeedParameters androidx.media3.transformer.DefaultEncoderFactory\$Builder androidx.media3.transformer.VideoEncoderSettings\$Builder androidx.media3.transformer.AudioEncoderSettings\$Builder androidx.media3.transformer.ExportException androidx.media3.transformer.ProgressHolder androidx.media3.effect.RgbMatrix androidx.media3.effect.Crop androidx.media3.effect.Brightness androidx.media3.effect.HslAdjustment\$Builder androidx.media3.effect.RgbFilter androidx.media3.effect.RgbAdjustment\$Builder androidx.media3.common.audio.SpeedProvider androidx.media3.effect.SingleFrameGlShaderProgram androidx.media3.common.util.GlUtil androidx.media3.common.SimpleBasePlayer androidx.media3.ui.PlayerView; do
            echo "--- $c"; javap -cp "$CP" "$c" 2>&1 | grep -v -E '^Compiled|access\$'
          done
