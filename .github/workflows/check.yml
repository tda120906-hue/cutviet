name: Check branch

# Compiles and tests work-in-progress branches without publishing a release.
on:
  push:
    branches-ignore: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: chmod +x gradlew && ./gradlew --no-daemon testDebugUnitTest

      - name: Compile release
        run: ./gradlew --no-daemon assembleRelease

      - name: Show APK size and native libraries
        run: |
          ls -l app/build/outputs/apk/release/*.apk
          unzip -l app/build/outputs/apk/release/*.apk | grep '\.so$' || true
